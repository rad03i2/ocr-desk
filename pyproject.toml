[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-desk"
version = "1.0.0"
description = "A local-first command-line workspace for reliable Tesseract OCR workflows."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
keywords = ["ocr", "tesseract", "cli", "privacy"]

[project.scripts]
ocr-desk = "ocr_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
