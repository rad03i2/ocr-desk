<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Rad03i2 signature</title>
  <desc id="desc">Personal signature mark for Radwan Abdulhadi Ahmed.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62eaff"/>
      <stop offset="1" stop-color="#4a75ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="760" height="220" rx="30" fill="#030814"/>
  <path d="M48 178 C142 162 230 177 326 157 S500 156 708 130" fill="none" stroke="url(#ink)" stroke-width="3" opacity=".65"/>
  <text x="380" y="118" text-anchor="middle" font-family="cursive" font-size="88" font-weight="700" font-style="italic" fill="url(#ink)" filter="url(#glow)">Rad03i2</text>
  <text x="380" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="5" fill="#b8cde0">RADWAN ABDULHADI AHMED</text>
  <text x="380" y="194" text-anchor="middle" direction="rtl" font-family="Arial, sans-serif" font-size="17" fill="#89a9c3">رضوان عبدالهادي أحمد</text>
</svg>
