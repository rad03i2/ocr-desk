<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">OCR Desk — Radwan Abdulhadi Ahmed</title>
  <desc id="desc">Personal branded hero cover for OCR Desk, a local-first OCR project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030814"/>
      <stop offset="0.48" stop-color="#07172c"/>
      <stop offset="1" stop-color="#02050c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#0fdcff" stop-opacity=".23"/>
      <stop offset=".55" stop-color="#0a6dff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19e5ff"/>
      <stop offset="1" stop-color="#3a7bff"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a7bdd7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d35" stop-opacity=".96"/>
      <stop offset="1" stop-color="#06111f" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#4dbdff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="800" rx="36" fill="url(#grid)"/>
  <ellipse cx="800" cy="325" rx="610" ry="360" fill="url(#halo)"/>
  <circle cx="800" cy="260" r="180" fill="#08c9ff" opacity=".06" filter="url(#soft)"/>

  <!-- Left physical document -->
  <g transform="translate(105 145) rotate(-4 245 230)">
    <rect x="34" y="36" width="380" height="490" rx="24" fill="#000" opacity=".35"/>
    <rect x="0" y="0" width="380" height="490" rx="24" fill="#f6f1e8"/>
    <rect x="22" y="22" width="336" height="446" rx="16" fill="#ede6d9" stroke="#1ecfff" stroke-opacity=".28"/>
    <text x="190" y="112" text-anchor="middle" direction="rtl" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#17212e">المعرفة تبني عالمًا أفضل</text>
    <rect x="54" y="158" width="272" height="160" rx="12" fill="#263645"/>
    <path d="M72 292 L135 220 L175 258 L222 196 L309 296 Z" fill="#8ca0ae"/>
    <path d="M72 292 L136 240 L184 275 L225 224 L309 296 Z" fill="#4d6372"/>
    <rect x="58" y="350" width="255" height="10" rx="5" fill="#53616f" opacity=".5"/>
    <rect x="58" y="377" width="230" height="10" rx="5" fill="#53616f" opacity=".38"/>
    <rect x="58" y="404" width="266" height="10" rx="5" fill="#53616f" opacity=".32"/>
    <path d="M18 86V24H80 M300 24h62v62 M18 405v62h62 M300 467h62v-62" fill="none" stroke="#1de3ff" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Right digital panel -->
  <g transform="translate(1110 145)">
    <rect x="0" y="0" width="380" height="490" rx="28" fill="url(#panel)" stroke="#1aa8ff" stroke-opacity=".55" stroke-width="2"/>
    <rect x="24" y="25" width="332" height="56" rx="14" fill="#0c2b4c"/>
    <circle cx="52" cy="53" r="8" fill="#18e3ff"/>
    <text x="78" y="61" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#d7f6ff">OCR Desk</text>
    <rect x="24" y="106" width="138" height="260" rx="16" fill="#091928" stroke="#1bdcff" stroke-opacity=".6"/>
    <rect x="45" y="132" width="96" height="135" rx="8" fill="#e7e0d4"/>
    <path d="M52 251 L75 214 L92 230 L111 199 L136 252 Z" fill="#758b99"/>
    <text x="93" y="292" text-anchor="middle" direction="rtl" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#dff7ff">صورة ممسوحة</text>
    <path d="M177 234H211" stroke="#1ee1ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M199 222l12 12-12 12" fill="none" stroke="#1ee1ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="226" y="106" width="130" height="260" rx="16" fill="#071525" stroke="#3a7bff" stroke-opacity=".55"/>
    <text x="291" y="151" text-anchor="middle" direction="rtl" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#eafcff">النص المستخرج</text>
    <g fill="#87a4bf">
      <rect x="246" y="188" width="88" height="8" rx="4"/>
      <rect x="246" y="214" width="70" height="8" rx="4" opacity=".85"/>
      <rect x="246" y="240" width="92" height="8" rx="4" opacity=".75"/>
      <rect x="246" y="266" width="78" height="8" rx="4" opacity=".65"/>
      <rect x="246" y="292" width="58" height="8" rx="4" opacity=".55"/>
    </g>
    <rect x="24" y="391" width="332" height="70" rx="16" fill="#081a2b"/>
    <text x="44" y="433" font-family="Arial, sans-serif" font-size="18" fill="#83a9c8">LOCAL • PRIVATE • RELIABLE</text>
  </g>

  <!-- Data flow -->
  <path d="M485 340 C610 255, 660 330, 730 296 S900 250, 1100 336" fill="none" stroke="url(#cyan)" stroke-width="4" opacity=".65" filter="url(#glow)"/>
  <path d="M500 365 C625 300, 690 375, 760 335 S940 300, 1090 360" fill="none" stroke="#39a7ff" stroke-width="2" opacity=".3"/>
  <g fill="#39dfff" opacity=".8">
    <rect x="580" y="292" width="10" height="10" rx="2"/><rect x="676" y="332" width="8" height="8" rx="2"/>
    <rect x="925" y="285" width="9" height="9" rx="2"/><rect x="1015" y="320" width="7" height="7" rx="2"/>
  </g>

  <!-- Central icon -->
  <g transform="translate(708 80)" filter="url(#glow)">
    <rect width="184" height="184" rx="42" fill="#071b2e" stroke="url(#cyan)" stroke-width="4"/>
    <path d="M46 62V38h24 M138 38h-24 M46 122v24h24 M138 146h-24" fill="none" stroke="#22e5ff" stroke-width="10" stroke-linecap="round"/>
    <path d="M77 50h52l22 23v67H77z" fill="url(#silver)"/>
    <path d="M129 50v24h22" fill="#9fb7cc"/>
    <text x="103" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="800" fill="#06111d">A</text>
    <rect x="90" y="119" width="42" height="5" rx="2.5" fill="#06111d"/>
  </g>

  <!-- Main title -->
  <text x="800" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-4">
    <tspan fill="#20dbff">OCR</tspan><tspan fill="#eef6ff"> Desk</tspan>
  </text>
  <rect x="520" y="400" width="560" height="76" rx="22" fill="#071a2e" stroke="#1aaaff" stroke-opacity=".65"/>
  <text x="800" y="452" text-anchor="middle" direction="rtl" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#aeefff">استخراج النصوص من الصور محليًا</text>
  <text x="800" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" letter-spacing="1" fill="#9eb6ca">Local-first OCR for reliable document workflows</text>

  <!-- Personal identity -->
  <g transform="translate(800 610)">
    <text x="0" y="0" text-anchor="middle" font-family="cursive" font-size="54" font-style="italic" fill="#56a5ff" filter="url(#glow)">Rad03i2</text>
    <path d="M-120 16 C-45 2, 50 8, 125 0" fill="none" stroke="#35bfff" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#e6f3ff">RADWAN ABDULHADI AHMED</text>
    <text x="0" y="91" text-anchor="middle" direction="rtl" font-family="Arial, sans-serif" font-size="22" fill="#d5e8f7">رضوان عبدالهادي أحمد</text>
    <text x="0" y="128" text-anchor="middle" font-family="monospace" font-size="22" fill="#65cfff">@rad03i2</text>
  </g>

  <!-- Personal motto + corners -->
  <text x="84" y="720" font-family="Arial, sans-serif" font-size="14" letter-spacing="5" fill="#6ca9ce">SIMPLE TOOLS • REAL IMPACT</text>
  <text x="1516" y="720" text-anchor="end" font-family="Arial, sans-serif" font-size="14" letter-spacing="4" fill="#6ca9ce">BUILD • LEARN • CREATE</text>
  <path d="M50 70h70M50 70v70 M1550 70h-70M1550 70v70 M50 750h70M50 750v-70 M1550 750h-70M1550 750v-70" fill="none" stroke="#1aaeff" stroke-opacity=".35" stroke-width="2"/>
</svg>