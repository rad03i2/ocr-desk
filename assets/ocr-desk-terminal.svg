<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">OCR Desk terminal preview</title>
  <desc id="desc">A terminal session showing OCR Desk commands using the optical-grid identity.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#BFD0FF" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1400" height="620" rx="34" fill="#14213D"/>
  <rect width="1400" height="620" rx="34" fill="url(#grid)"/>
  <rect x="34" y="32" width="1332" height="74" rx="20" fill="#1D2B4B"/>
  <circle cx="72" cy="69" r="9" fill="#F05A47"/>
  <circle cx="104" cy="69" r="9" fill="#E9B949"/>
  <circle cx="136" cy="69" r="9" fill="#5BB98C"/>
  <text x="700" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFDF8">OCR Desk · local session</text>

  <g font-family="Consolas, Menlo, monospace" font-size="27">
    <text x="72" y="170" fill="#F05A47">$</text>
    <text x="108" y="170" fill="#FFFDF8">ocr-desk --version</text>
    <text x="108" y="210" fill="#BFD0FF">OCR Desk 1.0.0</text>

    <text x="72" y="280" fill="#F05A47">$</text>
    <text x="108" y="280" fill="#FFFDF8">ocr-desk languages</text>
    <text x="108" y="320" fill="#BFD0FF">ara</text>
    <text x="180" y="320" fill="#BFD0FF">eng</text>

    <text x="72" y="390" fill="#F05A47">$</text>
    <text x="108" y="390" fill="#FFFDF8">ocr-desk scan document.jpg -l ara+eng -o document.txt</text>
    <text x="108" y="430" fill="#9BE1C1">OCR complete: document.txt</text>

    <text x="72" y="500" fill="#F05A47">$</text>
    <text x="108" y="500" fill="#FFFDF8">ocr-desk scan page.tif -l ara -f pdf -o page-searchable.pdf</text>
    <text x="108" y="540" fill="#9BE1C1">OCR complete: page-searchable.pdf</text>
  </g>

  <text x="1328" y="584" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#BFD0FF">LOCAL · PRIVATE · SCRIPTABLE</text>
</svg>