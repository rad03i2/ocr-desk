<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">OCR Desk — Project Identity</title>
  <desc id="desc">Editorial optical-grid cover for OCR Desk, a local-first Tesseract OCR command-line tool by Radwan Abd alhady Ahmed.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-opacity=".055"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#2563EB" stop-opacity=".28"/>
      <stop offset="1" stop-color="#F05A47" stop-opacity=".05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#14213D" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1600" height="800" rx="32" fill="#F7F4EC"/>
  <rect width="1600" height="800" rx="32" fill="url(#grid)"/>
  <rect x="44" y="44" width="1512" height="712" rx="28" fill="none" stroke="#14213D" stroke-opacity=".12" stroke-width="2"/>

  <!-- optical mark -->
  <g transform="translate(105 100)">
    <rect width="112" height="112" rx="30" fill="#14213D"/>
    <path d="M29 45V29h16M83 29H67M29 67v16h16M83 83H67" fill="none" stroke="#F7F4EC" stroke-width="8" stroke-linecap="round"/>
    <path d="M48 34h28l14 14v34H48z" fill="#F7F4EC"/>
    <path d="M76 34v15h14" fill="#D9D3C6"/>
    <path d="M43 59h52" stroke="#F05A47" stroke-width="6" stroke-linecap="round"/>
    <path d="M56 70h24M56 77h18" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- left editorial block -->
  <text x="105" y="298" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="7" fill="#2563EB">LOCAL-FIRST DOCUMENT OCR</text>
  <text x="102" y="410" font-family="Arial, Helvetica, sans-serif" font-size="126" font-weight="900" letter-spacing="-7" fill="#14213D">OCR Desk</text>
  <rect x="106" y="442" width="196" height="9" rx="4.5" fill="#F05A47"/>
  <text x="105" y="510" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#24324F">Turn document images into searchable text — locally.</text>
  <text x="105" y="566" direction="rtl" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#14213D">استخراج النصوص من الصور محليًا، بوضوح وخصوصية</text>

  <g transform="translate(105 625)">
    <rect width="190" height="46" rx="23" fill="#14213D"/>
    <text x="95" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#F7F4EC">PRIVATE</text>
    <rect x="204" width="190" height="46" rx="23" fill="#E7E1D5"/>
    <text x="299" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#14213D">SCRIPTABLE</text>
    <rect x="408" width="190" height="46" rx="23" fill="#2563EB"/>
    <text x="503" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#FFFFFF">TESSERACT</text>
  </g>

  <!-- right transformation panel -->
  <g transform="translate(1010 108)" filter="url(#shadow)">
    <rect width="438" height="536" rx="28" fill="#FFFDF8" stroke="#14213D" stroke-opacity=".12" stroke-width="2"/>
    <text x="34" y="54" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#6C7483">DOCUMENT → TEXT</text>

    <g transform="translate(34 92)">
      <rect width="162" height="222" rx="16" fill="#F2EEE5" stroke="#14213D" stroke-opacity=".14"/>
      <path d="M116 0h30l16 18v28" fill="#E6E0D4"/>
      <path d="M116 0v46h46" fill="none" stroke="#14213D" stroke-opacity=".1"/>
      <rect x="22" y="40" width="95" height="10" rx="5" fill="#14213D" opacity=".8"/>
      <rect x="22" y="66" width="116" height="7" rx="3.5" fill="#14213D" opacity=".34"/>
      <rect x="22" y="85" width="103" height="7" rx="3.5" fill="#14213D" opacity=".26"/>
      <rect x="22" y="104" width="111" height="7" rx="3.5" fill="#14213D" opacity=".26"/>
      <rect x="22" y="145" width="118" height="44" rx="8" fill="#D8E3FF"/>
      <path d="M11 96h140" stroke="#F05A47" stroke-width="7" stroke-linecap="round"/>
      <path d="M10 31V12h19M152 31V12h-19M10 191v19h19M152 191v19h-19" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
    </g>

    <path d="M214 202h42" stroke="#F05A47" stroke-width="6" stroke-linecap="round"/>
    <path d="M244 190l12 12-12 12" fill="none" stroke="#F05A47" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(276 92)">
      <rect width="128" height="222" rx="16" fill="#14213D"/>
      <rect x="20" y="33" width="78" height="8" rx="4" fill="#FFFFFF" opacity=".95"/>
      <rect x="20" y="60" width="88" height="6" rx="3" fill="#BFD0FF"/>
      <rect x="20" y="80" width="72" height="6" rx="3" fill="#BFD0FF"/>
      <rect x="20" y="100" width="90" height="6" rx="3" fill="#BFD0FF"/>
      <rect x="20" y="120" width="66" height="6" rx="3" fill="#BFD0FF"/>
      <rect x="20" y="155" width="88" height="34" rx="9" fill="#F05A47"/>
      <text x="64" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SEARCHABLE</text>
    </g>

    <rect x="34" y="354" width="370" height="1.5" fill="#14213D" opacity=".1"/>
    <text x="34" y="402" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#2563EB">$ ocr-desk scan page.tif -l ara</text>
    <text x="34" y="438" font-family="Consolas, Menlo, monospace" font-size="18" fill="#48536A">OCR complete: page.ocr.txt</text>
    <rect x="34" y="472" width="370" height="34" rx="17" fill="url(#scan)"/>
    <text x="219" y="495" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#14213D">SAFE OUTPUT WORKFLOW</text>
  </g>

  <text x="105" y="727" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#14213D">رضوان عبدالهادي · Radwan Abd alhady Ahmed</text>
  <text x="1490" y="727" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#6C7483">A RADWAN ABD ALHADY PROJECT</text>
</svg>